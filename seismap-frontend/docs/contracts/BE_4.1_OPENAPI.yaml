components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token_cookie
      description: JWT access cookie. Request mutasi juga memerlukan X-CSRF-TOKEN.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token_cookie
      description: JWT refresh cookie; refresh request memakai CSRF cookie refresh.
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data: {}
        meta:
          type: object
          required:
          - status
          properties:
            status:
              const: success
            count:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    ErrorEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: 'null'
        meta:
          type: object
          required:
          - status
          - code
          - message
          - details
          properties:
            status:
              const: error
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    LoginRequest:
      type: object
      required:
      - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          format: password
      description: Salah satu dari email atau username wajib diisi.
    ParameterSearchRequest:
      type: object
      required:
      - min_samples_candidates
      properties:
        min_samples_candidates:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 2
        sensitivity_percentages:
          type: array
          items:
            type: number
          default:
          - -20
          - -10
          - 0
          - 10
          - 20
        eps_candidates_km:
          type:
          - array
          - 'null'
          items:
            type: number
            exclusiveMinimum: 0
          description: Jika tidak diberikan/null, epsilon dihitung dari k-distance knee dan sensitivity percentages.
    FinalRunRequest:
      type: object
      required:
      - experiment_id
      properties:
        experiment_id:
          type: integer
          minimum: 1
      description: Backend mengambil epsilon dan MinPts dari eksperimen terpilih. DBSCAN menggunakan latitude dan longitude dengan metric Haversine; kedalaman hanya digunakan untuk profiling pascaklasterisasi.
    BMKGEvent:
      type: object
      properties:
        event_time_utc:
          type:
          - string
          - 'null'
        date_local:
          type:
          - string
          - 'null'
        time_local:
          type:
          - string
          - 'null'
        magnitude:
          type: number
        depth_km:
          type:
          - number
          - 'null'
        latitude:
          type: number
        longitude:
          type: number
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        region:
          type:
          - string
          - 'null'
        tsunami_potential:
          type:
          - string
          - 'null'
        tsunami_potential_raw:
          type:
          - string
          - 'null'
        felt:
          type:
          - string
          - 'null'
        shakemap_url:
          type:
          - string
          - 'null'
          format: uri
    DatasetValidationData:
      type: object
      properties:
        valid:
          type: boolean
        persisted:
          type: boolean
          const: false
        filename:
          type: string
        file_hash_sha256:
          type: string
        row_count:
          type: integer
        required_columns:
          type: array
          items:
            type: string
        rules:
          type: object
          additionalProperties: true
    JwtMessageEnvelope:
      type: object
      required:
      - msg
      properties:
        msg:
          type: string
      description: Bentuk error default Flask-JWT-Extended yang terlihat pada beberapa kegagalan cookie/token.
