openapi: 3.1.0
info:
  title: Backend WebGIS Gempa Bumi — DBSCAN API
  version: '4.1'
  description: Kontrak API berdasarkan source BE 4.1. Base URL pengembangan.
servers:
- url: http://127.0.0.1:5000
  description: Local development
tags:
- name: Health
- name: Authentication
- name: Admin Dataset
- name: Admin Jobs
- name: Admin Runs
- name: Admin Support
- name: Public WebGIS
- name: BMKG Realtime
paths:
  /api/health:
    get:
      operationId: healthLiveness
      summary: Liveness check
      tags:
      - Health
      description: Memastikan proses Flask hidup; tidak memeriksa dependency.
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
  /api/health/ready:
    get:
      operationId: healthReadiness
      summary: Readiness check
      tags:
      - Health
      description: Memeriksa koneksi PostgreSQL dan Redis.
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '503':
          description: Satu atau lebih dependency belum siap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
  /api/auth/login:
    post:
      operationId: authLogin
      summary: Login admin
      tags:
      - Authentication
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Kredensial tidak valid atau akun terkunci.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: Email/username dan password wajib.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access cookie
      tags:
      - Authentication
      description: Menggunakan refresh_token_cookie dan csrf_refresh_token.
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Refresh cookie tidak valid/tidak ada.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      security:
      - refreshCookie: []
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Logout
      tags:
      - Authentication
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Access cookie tidak valid/tidak ada.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      security: &id001
      - accessCookie: []
  /api/auth/me:
    get:
      operationId: authMe
      summary: Identitas pengguna aktif
      tags:
      - Authentication
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Access cookie tidak valid/tidak ada.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      security: *id001
  /api/admin/datasets:
    get:
      operationId: listDatasets
      summary: Daftar dataset
      tags:
      - Admin Dataset
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: Query tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
          description: Status dataset; dibandingkan dalam uppercase.
      security: *id001
    post:
      operationId: uploadDataset
      summary: Upload CSV bersih
      tags:
      - Admin Dataset
      description: Import CSV bersih; request memakai multipart/form-data.
      responses:
        '201':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '409':
          description: Hash dataset sudah terdaftar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '413':
          description: File terlalu besar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '415':
          description: Ekstensi bukan CSV.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: CSV atau metadata tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '500':
          description: Upload/import gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - dataset_name
              - source_name
              properties:
                file:
                  type: string
                  format: binary
                dataset_name:
                  type: string
                source_name:
                  type: string
                source_url:
                  type: string
                preprocessing_version:
                  type: string
      security: *id001
  /api/admin/datasets/validate:
    post:
      operationId: validateDataset
      summary: Dry-run validasi CSV
      tags:
      - Admin Dataset
      description: Tidak membuat dataset atau menyimpan file permanen; audit event validasi tetap dicatat.
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '409':
          description: SHA-256 sudah terdaftar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '413':
          description: File terlalu besar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '415':
          description: Bukan CSV.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: CSV tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '500':
          description: Validasi gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      security: *id001
  /api/admin/datasets/{dataset_id}:
    get:
      operationId: getDatasetDetail
      summary: Detail dataset
      tags:
      - Admin Dataset
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Dataset tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security: *id001
  /api/admin/datasets/{dataset_id}/parameter-search:
    post:
      operationId: startParameterSearch
      summary: Jadwalkan parameter search
      tags:
      - Admin Dataset
      description: ''
      responses:
        '202':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Dataset tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '409':
          description: Dataset belum READY atau job masih berjalan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: Parameter tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '503':
          description: Task tidak dapat dijadwalkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterSearchRequest'
      security: *id001
  /api/admin/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Status job
      tags:
      - Admin Jobs
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Job tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security: *id001
  /api/admin/jobs/{job_id}/experiments:
    get:
      operationId: getJobExperiments
      summary: Eksperimen dari job
      tags:
      - Admin Jobs
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Job tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security: *id001
  /api/admin/datasets/{dataset_id}/runs:
    get:
      operationId: listDatasetRuns
      summary: Riwayat run dataset
      tags:
      - Admin Runs
      description: Route saat ini mengembalikan maksimum 200 run; tidak menerima page/limit.
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Dataset tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security: *id001
    post:
      operationId: createFinalRun
      summary: Buat final clustering run
      tags:
      - Admin Runs
      description: DBSCAN memakai latitude dan longitude dengan metric Haversine. Epsilon dan MinPts diambil dari eksperimen terpilih; kedalaman hanya dipakai untuk profiling setelah clustering.
      responses:
        '202':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '403':
          description: Admin required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '404':
          description: Dataset/eksperimen tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '409':
          description: Dataset belum siap, eksperimen tidak valid, atau job aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '422':
          description: Threshold tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '503':
          description: Task tidak dapat dijadwalkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Nilai csrf_access_token atau csrf_refresh_token sesuai endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalRunRequest'
      security: *id001
  /api/admin/runs/{run_id}:
    get:
      operationId: getRunDetail
      summary: Detail run
      tags:
      - Admin Runs
      description: ''
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/JwtMessageEnvelope'
